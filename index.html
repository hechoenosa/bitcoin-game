<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spark Night Prank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110d;--ink:#f4ede1;--dim:#8a8172;--btc:#f7931a;--deep:#b8650a;--leaf:#4f8a5b;--err:#d4452f}
*{box-sizing:border-box;cursor:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;user-select:none;-webkit-user-select:none}
body{background-image:radial-gradient(rgba(244,237,225,.07) 1px,transparent 1.5px);background-size:28px 28px}

header,footer{position:fixed;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:28px 40px;z-index:3;pointer-events:none}
header{top:0;align-items:flex-start}
footer{bottom:0;font-size:15px;color:var(--dim)}
footer b{color:var(--ink)}
.spark{font-family:"Archivo Black",Impact,sans-serif;font-size:46px;letter-spacing:.01em;line-height:.9;display:block}
.spark i{font-style:normal;color:var(--btc)}
.sub{display:block;margin-top:10px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.mode{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);border:1px solid #3a342b;padding:8px 12px;border-radius:999px}
.url-s{font-size:20px;color:var(--ink)}
.url-s span{color:var(--btc)}

#caption{position:fixed;left:0;right:0;bottom:120px;text-align:center;font-size:30px;font-weight:700;z-index:3;pointer-events:none;min-height:40px}
#caption.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

.btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  transition:left .32s cubic-bezier(.3,1.4,.5,1),top .32s cubic-bezier(.3,1.4,.5,1)}
.btn[hidden]{display:none}
.face{position:relative;width:min(480px,72vw);height:230px;border-radius:30px;background:var(--btc);color:#1a1006;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;
  box-shadow:0 10px 0 var(--deep),0 34px 60px -24px rgba(0,0,0,.7);transition:transform .08s,box-shadow .08s,background .3s}
.btn:not(.busy) .face{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035) rotate(-.6deg)}}
.mark{position:absolute;left:50%;top:50%;font-size:340px;line-height:1;font-weight:700;color:#fff;opacity:.22;
  transform:translate(-50%,-52%) rotate(-14deg);font-family:system-ui,"Segoe UI Symbol",sans-serif;pointer-events:none}
.word{position:relative;font-family:"Archivo Black",Impact,sans-serif;font-size:72px;line-height:1;letter-spacing:.01em}
.cta{position:relative;font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.cta span{display:inline-block;animation:hop .9s ease-in-out infinite}
.cta span:nth-child(2){animation-delay:.15s}.cta span:nth-child(3){animation-delay:.3s}
@keyframes hop{50%{transform:translateY(-5px)}}
.btn.pressed .face{transform:translateY(7px);box-shadow:0 3px 0 var(--deep),0 20px 40px -24px rgba(0,0,0,.7)}
.btn::after{content:"";position:absolute;inset:-72px;border:2px dashed rgba(244,237,225,.55);border-radius:50%;opacity:0;transition:opacity .2s;pointer-events:none}
.btn.shield::after{opacity:1;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#sparks{position:fixed;inset:0;z-index:9;pointer-events:none}
#pranked{position:fixed;inset:0;z-index:8;display:none;place-items:center;pointer-events:none;
  font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(80px,15vw,240px);color:var(--btc);letter-spacing:-.01em}
#pranked.on{display:grid;animation:slam .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes slam{from{transform:scale(2.4) rotate(-6deg);opacity:0}to{transform:rotate(-4deg);opacity:1}}

#crash{position:fixed;z-index:8;display:none;transform:translate(-50%,-50%);pointer-events:none}
#crash.on{display:block}
#crash b{display:block;background:var(--err);color:#fff;font-family:"Archivo Black",Impact,sans-serif;font-size:56px;line-height:1;
  padding:20px 38px;border-radius:18px;box-shadow:0 8px 0 #8f2a1c;transform-origin:bottom center;
  animation:bounce .5s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes bounce{from{transform:translateY(0) scale(1.1,.9)}to{transform:translateY(-80px) scale(.96,1.05)}}
#crash.off b{animation:popout .3s forwards}
@keyframes popout{to{transform:scale(0) rotate(-20deg);opacity:0}}

.mini{position:absolute;transform:translate(-50%,-50%);z-index:2;transition:left .5s cubic-bezier(.3,1.3,.5,1),top .5s cubic-bezier(.3,1.3,.5,1),opacity .5s}
.mini .face{width:160px;height:76px;border-radius:16px;gap:0;box-shadow:0 6px 0 var(--deep);animation:none}
.mini .word{font-size:24px}
.mini .mark{font-size:120px}
.mini.gone .face{background:#4a443b;color:var(--ink);box-shadow:0 6px 0 #2a2620;transform:rotate(10deg) scale(.88)}
.mini.gone .mark{opacity:0}
.mini.out{opacity:0}


#cur{position:fixed;left:0;top:0;z-index:10;pointer-events:none;margin:-2px 0 0 -2px;transition:none}
#cur svg{display:block;transition:transform .08s}
#cur.press svg{transform:scale(.82)}
</style>
</head>
<body>

<header>
  <div><span class="spark">SPARK <i>NIGHT</i></span><span class="sub">Hecho en Osa × Bitcoin Jungle · 19 Oct</span></div>
  <div class="mode" id="modeTag"></div>
</header>

<div class="btn" id="btn"></div>
<div id="clones"></div>
<div id="caption"></div>

<footer>
  <div>attempts <b id="att">0</b> &nbsp;·&nbsp; bitcoin won <b id="won">0</b></div>
  <div class="url-s">Want to build something real? → <span>thegift.is/hechoenosa</span></div>
</footer>

<div id="crash"><b>ERROR</b></div>

<div id="pranked">PRANKED</div>

<canvas id="sparks"></canvas>

<div id="cur"><svg width="30" height="34" viewBox="0 0 30 34"><path d="M2 2 L2 26 L8.5 20 L13 31 L18 29 L13.5 18 L22 18 Z" fill="#f4ede1" stroke="#14110d" stroke-width="2" stroke-linejoin="round"/></svg></div>

<script>
const ROUND_MS = 20000; // each prank runs this long, then the next one starts
const $ = id => document.getElementById(id);
const btn = $('btn'), cur = $('cur'), cap = $('caption'), layer = $('clones');

const FACE = `<div class="face"><span class="mark">₿</span><span class="word">BITCOIN</span>
  <span class="cta"><span>click me</span> · <span>click me</span> · <span>click me</span></span></div>`;

const SHY    = ['nope', 'too slow', 'it saw you coming', 'almost!', 'HODL… no, not like that', 'have you tried being faster?', 'so close. not really.'];
const MIRROR = ['wait, which way is left?', 'your mouse has opinions', 'left is right now', 'try the other other way'];
const FIELD  = ['hmm', 'almost', 'so close', 'oops', 'one more try'];
const MISS   = ['missed', 'that was air', 'swing and a miss', 'the button felt that, emotionally'];
const FAKES  = ['fake', 'also fake', 'a sticker', 'chocolate coin', 'IOU', 'screenshot', 'monopoly money', 'a rumor', 'lol', 'counterfeit', 'nope', 'drawn with crayon'];

let mx = innerWidth / 2, my = innerHeight * .8, fx = mx, fy = my;
let bx = innerWidth / 2, by = innerHeight / 2;
let mode = null, modeKey = null, last = null, bag = [], S = {}, busy = false, timers = [], attempts = 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const now = () => performance.now();

function say(t) { cap.classList.remove('pop'); void cap.offsetWidth; cap.textContent = t; if (t) cap.classList.add('pop'); }
function place(x, y, instant) {
  bx = x; by = y;
  if (instant) btn.style.transition = 'none';
  btn.style.left = x + 'px'; btn.style.top = y + 'px';
  if (instant) { void btn.offsetWidth; btn.style.transition = ''; }
}
function hit(el, x = fx, y = fy) { const r = el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }
function gap(el, x = fx, y = fy) {
  const r = el.getBoundingClientRect();
  return Math.hypot(Math.max(r.left - x, 0, x - r.right), Math.max(r.top - y, 0, y - r.bottom));
}
function randomSpot(w, h) {
  return [rnd(w / 2 + 30, innerWidth - w / 2 - 30), rnd(h / 2 + 120, innerHeight - h / 2 - 150)];
}

// ---------- the five pranks ----------
const MODES = {
  shy: {
    label: '01 · shy',
    enter() { S.n = 0; S.cool = 0; say("Go on. It's free money."); },
    frame() {
      if (now() < S.cool || gap(btn) > 60) return;
      const w = btn.offsetWidth, h = btn.offsetHeight;
      let best = null, bestD = -1;
      for (let i = 0; i < 24; i++) {
        const p = randomSpot(w, h), d = Math.hypot(p[0] - fx, p[1] - fy);
        if (d > bestD) { bestD = d; best = p; }
      }
      burst(bx, by, 30, 1.1);
      place(...best); S.cool = now() + 280; say(pick(SHY));
    },
    down() { say(pick(SHY)); }
  },

  mirror: {
    label: '02 · mirror',
    enter() { S.miss = 0; S.said = 0; say('Steady hands now.'); },
    near() { return Math.hypot(fx - bx, fy - by) < 340; },
    warp(dx, dy) {
      if (!this.near()) return [dx, dy];
      if (now() - S.said > 1500) { S.said = now(); say(pick(MIRROR)); }
      return [-dx * 1.15, -dy * 1.15];
    },
    down() {
      if (!hit(btn)) return say(pick(MISS));
      burst(bx, by, 30, 1.1);
      place(...randomSpot(btn.offsetWidth, btn.offsetHeight));
      say('nope');
    }
  },

  field: {
    label: '03 · force field',
    enter() { S.miss = 0; say('Go on.'); },
    cursor() {
      const rw = btn.offsetWidth / 2 + 72, rh = btn.offsetHeight / 2 + 72;
      let nx = (mx - bx) / rw, ny = (my - by) / rh, d = Math.hypot(nx, ny);
      if (d >= 1) { btn.classList.remove('shield'); return [mx, my]; }
      btn.classList.add('shield');
      if (d < .01) { nx = 0; ny = 1; d = 1; }
      const j = (1 - d) * 7;
      return [bx + nx / d * rw + rnd(-j, j), by + ny / d * rh + rnd(-j, j)];
    },
    down() {
      say(pick(FIELD));
    }
  },

  clones: {
    label: '04 · clones',
    enter() { S.split = false; say('This one is definitely real.'); },
    frame() { if (!S.split && gap(btn) < 25) split(); },
    down() {
      if (!S.split) return;
      const live = [...layer.children].filter(el => !el.classList.contains('gone'));
      const c = live.find(el => hit(el));
      if (!c) return say(pick(MISS));
      const cr = c.getBoundingClientRect();
      burst(cr.left + cr.width / 2, cr.top + cr.height / 2, 30, 1);
      c.classList.add('gone');
      c.querySelector('.word').textContent = pick(FAKES);
      setTimeout(() => c.classList.add('out'), 900);
      say(pick(['nope', 'fake!', 'try another', 'the real one is close', 'keep going']));
      const rest = live.filter(el => el !== c);
      rest.forEach(el => { const [x, y] = randomSpot(170, 90); el.style.left = x + 'px'; el.style.top = y + 'px'; });
      if (!rest.length) later(() => { // all popped: the real one comes back and the trick starts over
        layer.innerHTML = ''; btn.hidden = false; S.split = false;
        place(innerWidth / 2, innerHeight / 2, true); burst(bx, by, 60, 1.4);
      }, 1200);
    }
  },

  crash: {
    label: '05 · crash',
    enter() {
      S.go = false;
      btn.querySelector('.cta').innerHTML = '<span>ok</span> · <span>you</span> · <span>win</span>';
      say("This time you can have it.");
    },
    down() {
      if (S.go) return;
      if (!hit(btn)) return say(pick(MISS));
      S.go = true; crash();
    }
  }
};

function split() {
  S.split = true; btn.hidden = true; say('Uh oh. Which one is real?');
  burst(bx, by, 80, 1.6);
  for (let i = 0; i < 12; i++) {
    const m = document.createElement('div');
    m.className = 'mini';
    m.innerHTML = '<div class="face"><span class="mark">₿</span><span class="word">BITCOIN</span></div>';
    m.style.left = bx + 'px'; m.style.top = by + 'px';
    layer.appendChild(m);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const [x, y] = randomSpot(170, 90); m.style.left = x + 'px'; m.style.top = y + 'px';
    }));
  }
}

function crash() {
  burst(fx, fy, 70, 1.6, ['#ffffff', '#ff6a4d', '#ffc25c']);
  const el = $('crash');
  el.style.left = bx + 'px'; el.style.top = by + 'px';
  btn.hidden = true; say(''); el.className = 'on';
  const t = 3000;
  later(() => { el.className = 'on off'; }, t);
  later(() => {
    el.className = ''; btn.hidden = false;
    btn.innerHTML = FACE;
    btn.querySelector('.cta').textContent = '…where were we?';
    burst(bx, by, 90, 1.7);
    say("We're back. Nobody saw that.");
  }, t + 550);
  later(() => { // re-arm so it can crash again
    btn.querySelector('.cta').innerHTML = '<span>ok</span> · <span>you</span> · <span>win</span>';
    say(''); S.go = false;
  }, t + 3500);
}

// ---------- sparks ----------
const cv = $('sparks'), cx = cv.getContext('2d');
const HOT = ['#f7931a', '#ffc25c', '#f4ede1', '#ff7a1a'];
let P = [];
function sizeCanvas() {
  const d = devicePixelRatio || 1;
  cv.width = innerWidth * d; cv.height = innerHeight * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
sizeCanvas(); addEventListener('resize', sizeCanvas);

function burst(x, y, n = 24, power = 1, colors = HOT) {
  n = Math.round(n * 3);
  if (P.length > 4000) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rnd(2, 9) * power * .8;
    P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.6 * power, life: 1, decay: rnd(.0096, .024), c: pick(colors), w: rnd(1.2, 2.8), ph: rnd(0, 6.28), sp: rnd(.25, .6) });
  }
}
function fizz() { // a few sparks off the button's edge, like a lit fuse
  burst(rnd(0, innerWidth), rnd(0, innerHeight * .7), 1, .4); // sparkles drifting across the whole screen
  if (btn.hidden || busy) return;
  const r = btn.getBoundingClientRect();
  for (let i = 0; i < 2; i++) {
    const side = Math.floor(Math.random() * 4);
    const x = side < 2 ? rnd(r.left, r.right) : (side === 2 ? r.left : r.right);
    const y = side >= 2 ? rnd(r.top, r.bottom) : (side === 0 ? r.top : r.bottom);
    burst(x, y, 1, .6);
  }
}
function drawSparks() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  P = P.filter(p => p.life > 0 && p.y < innerHeight + 20);
  cx.lineCap = 'round';
  for (const p of P) {
    p.vy += .115; p.vx *= .985; p.vy *= .985;
    p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.ph += p.sp;
    const shimmer = .35 + .65 * Math.abs(Math.sin(p.ph)); // each spark twinkles at its own pace
    cx.globalAlpha = Math.max(p.life, 0) * shimmer;
    cx.strokeStyle = shimmer > .95 ? '#fff8e6' : p.c; cx.lineWidth = p.w;
    cx.beginPath(); cx.moveTo(p.x - p.vx * 1.6, p.y - p.vy * 1.6); cx.lineTo(p.x, p.y); cx.stroke();
  }
  cx.globalAlpha = 1;
}

// ---------- round flow ----------
function drawMode() {
  if (!bag.length) {
    bag = Object.keys(MODES).sort(() => Math.random() - .5);
    while (bag[0] === last || bag[0] === 'field') bag.push(bag.shift()); // the circle one never opens a round
  }
  if (!last) { // the very first prank is always the runaway button
    bag = bag.filter(k => k !== 'shy');
    return last = 'shy';
  }
  return last = bag.shift();
}

function startMode(key) {
  timers.forEach(clearTimeout); timers = [];
  busy = false; $('pranked').className = '';
  layer.innerHTML = ''; $('crash').className = '';
  btn.className = 'btn'; btn.innerHTML = FACE; btn.hidden = false;
  place(innerWidth / 2, innerHeight / 2, true);
  S = {}; modeKey = key; mode = MODES[key];
  $('modeTag').textContent = mode.label;
  fx = mx; fy = my;
  mode.enter();
  later(nextRound, ROUND_MS);
}

function nextRound() {
  if (bag.length) return startMode(drawMode());
  // all five done: flash PRANKED over the game, then loop again
  busy = true; say(''); $('pranked').className = 'on';
  [.15, .5, .85].forEach((k, i) => later(() => burst(innerWidth * k, innerHeight * rnd(.25, .5), 50, 1.4), i * 200));
  later(() => startMode(drawMode()), 2800);
}

// ---------- input ----------
addEventListener('mousemove', e => {
  const dx = e.clientX - mx, dy = e.clientY - my;
  mx = e.clientX; my = e.clientY;
  if (mode && mode.warp && !busy) { const [a, b] = mode.warp(dx, dy); fx += a; fy += b; }
  burst(fx, fy, 1, .35); // cursor trail
});

addEventListener('mousedown', () => {
  cur.classList.add('press'); setTimeout(() => cur.classList.remove('press'), 120);
  burst(fx, fy, 14, .7);
  if (busy || !mode) return;
  $('att').textContent = ++attempts;
  if (!btn.hidden && hit(btn)) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 120); }
  mode.down && mode.down();
});

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === 'n') startMode(drawMode());
  else if (k === 'r') startMode(modeKey);
  else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if ('12345'.includes(k) && k) startMode(Object.keys(MODES)[+k - 1]);
});

addEventListener('resize', () => { if (!busy && !S.split) place(innerWidth / 2, innerHeight / 2, true); });

// ---------- loop ----------
(function loop() {
  if (mode) {
    if (busy) { fx += (mx - fx) * .2; fy += (my - fy) * .2; }
    else if (mode.cursor) [fx, fy] = mode.cursor();
    else if (mode.warp) { const k = mode.near() ? .02 : .07; fx += (mx - fx) * k; fy += (my - fy) * k; }
    else { fx = mx; fy = my; }
    if (!busy && mode.frame) mode.frame();
  }
  fx = clamp(fx, 0, innerWidth); fy = clamp(fy, 0, innerHeight);
  cur.style.transform = `translate(${fx}px,${fy}px)`;
  fizz(); drawSparks();
  requestAnimationFrame(loop);
})();

startMode(drawMode());
</script>
</body>
</html>
